openapi: 3.1.0
info:
  title: Orders API
  description: Orders for the demo shop.
  version: 1.0.0
paths:
  /orders:
    get:
      summary: List orders, newest first
      operationId: list_orders_orders_get
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/OrderStatus'
          - type: 'null'
          title: Status
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
                title: Response List Orders Orders Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      summary: Place an order
      operationId: place_order_orders_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewOrder'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /orders/{order_id}:
    get:
      summary: Get one order
      operationId: get_order_orders__order_id__get
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
          title: Order Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: No such order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /orders/{order_id}/cancel:
    post:
      summary: Cancel an order that has not shipped
      operationId: cancel_order_orders__order_id__cancel_post
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
          title: Order Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: No such order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The order is no longer cancellable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /orders/{order_id}/refunds:
    post:
      summary: Refund a delivered order in full, within 30 days of delivery
      operationId: refund_order_orders__order_id__refunds_post
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
          title: Order Id
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'
        '404':
          description: No such order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The order can't be refunded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    Error:
      properties:
        detail:
          type: string
          title: Detail
      type: object
      required:
      - detail
      title: Error
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    NewOrder:
      properties:
        customer_name:
          type: string
          maxLength: 100
          minLength: 1
          title: Customer Name
        items:
          items:
            $ref: '#/components/schemas/OrderItem'
          type: array
          minItems: 1
          title: Items
      type: object
      required:
      - customer_name
      - items
      title: NewOrder
    Order:
      properties:
        id:
          type: string
          title: Id
        customer_name:
          type: string
          title: Customer Name
        items:
          items:
            $ref: '#/components/schemas/OrderItem'
          type: array
          title: Items
        total_cents:
          type: integer
          title: Total Cents
        status:
          $ref: '#/components/schemas/OrderStatus'
        created_at:
          type: string
          format: date-time
          title: Created At
        delivered_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Delivered At
      type: object
      required:
      - id
      - customer_name
      - items
      - total_cents
      - status
      - created_at
      title: Order
    OrderItem:
      properties:
        sku:
          type: string
          maxLength: 40
          minLength: 1
          title: Sku
        name:
          type: string
          maxLength: 120
          minLength: 1
          title: Name
        quantity:
          type: integer
          maximum: 100.0
          minimum: 1.0
          title: Quantity
        unit_price_cents:
          type: integer
          minimum: 0.0
          title: Unit Price Cents
      type: object
      required:
      - sku
      - name
      - quantity
      - unit_price_cents
      title: OrderItem
    OrderStatus:
      type: string
      enum:
      - placed
      - shipped
      - delivered
      - refunded
      - cancelled
      title: OrderStatus
    Refund:
      properties:
        id:
          type: string
          title: Id
        order_id:
          type: string
          title: Order Id
        amount_cents:
          type: integer
          title: Amount Cents
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - order_id
      - amount_cents
      - created_at
      title: Refund
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
